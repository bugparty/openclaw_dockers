apiVersion: v1
kind: Namespace
metadata:
  name: openclaw
---
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-env
  namespace: openclaw
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: "openclaw-k8s-local"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-bootstrap
  namespace: openclaw
data:
  run-openclaw.sh: |
    #!/bin/bash
    set -euo pipefail

    CONFIG_DIR="${HOME}/.openclaw"
    CONFIG_FILE="${CONFIG_DIR}/openclaw.json"
    BASHRC_FILE="${HOME}/.bashrc"
    INPUTRC_FILE="${HOME}/.inputrc"

    mkdir -p "${CONFIG_DIR}" "${NODE_COMPILE_CACHE:-${HOME}/.cache/node-compile-cache}"

    if [ ! -f "${BASHRC_FILE}" ]; then
      printf '%s\n' \
        'export TERM="${TERM:-xterm-256color}"' \
        'export EDITOR="${EDITOR:-nano}"' \
        'export PAGER="${PAGER:-less}"' \
        "export LESS='-FRX'" \
        'export HISTFILE="${HOME}/.bash_history"' \
        'export HISTSIZE=5000' \
        'export HISTFILESIZE=10000' \
        "export PROMPT_COMMAND='history -a'" \
        '' \
        'shopt -s histappend checkwinsize' \
        '' \
        'if [ -n "${PS1:-}" ]; then' \
        "  PS1='\\[\\033[01;32m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]\\$ '" \
        'fi' \
        '' \
        "alias ll='ls -alF --color=auto'" \
        "alias la='ls -A --color=auto'" \
        "alias l='ls -CF --color=auto'" \
        "alias k='kubectl'" \
        '' \
        'if [ -f /etc/bash_completion ]; then' \
        '  . /etc/bash_completion' \
        'fi' \
        > "${BASHRC_FILE}"
    fi

    if [ ! -f "${INPUTRC_FILE}" ]; then
      printf '%s\n' \
        'set completion-ignore-case on' \
        'set show-all-if-ambiguous on' \
        'set colored-stats on' \
        'set mark-symlinked-directories on' \
        > "${INPUTRC_FILE}"
    fi

    if [ ! -f "${CONFIG_FILE}" ]; then
      printf '%s\n' \
        '{' \
        '  "gateway": {' \
        '    "controlUi": {' \
        '      "dangerouslyAllowHostHeaderOriginFallback": true' \
        '    }' \
        '  },' \
        '  "browser": {' \
        '    "enabled": true,' \
        '    "defaultProfile": "local-browser",' \
        '    "remoteCdpTimeoutMs": 2000,' \
        '    "remoteCdpHandshakeTimeoutMs": 4000,' \
        '    "profiles": {' \
        '      "local-browser": {' \
        '        "cdpUrl": "http://browser:9223",' \
        '        "color": "#00AA00"' \
        '      }' \
        '    }' \
        '  }' \
        '}' > "${CONFIG_FILE}"
    fi

    exec openclaw gateway \
      --allow-unconfigured \
      --bind lan \
      --port 18789 \
      --token "${OPENCLAW_GATEWAY_TOKEN:-}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browser-appuser
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-home
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 12Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-linuxbrew
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 12Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: browser-bootstrap
  namespace: openclaw
data:
  browser-entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail
    
    export HOME=/home/appuser
    export XDG_RUNTIME_DIR=/tmp/xdg-runtime-dir
    export WAYLAND_DISPLAY=wayland-0
    export DISPLAY=:0
    WESTON_CONFIG_DIR="${HOME}/.config/weston"
    WESTON_CERT="${WESTON_CONFIG_DIR}/rdp.crt"
    WESTON_KEY="${WESTON_CONFIG_DIR}/rdp.key"
    
    mkdir -p "${XDG_RUNTIME_DIR}" "${WESTON_CONFIG_DIR}" /tmp/.X11-unix
    chmod 700 "${XDG_RUNTIME_DIR}"
    chmod 1777 /tmp/.X11-unix
    
    # Start DBus session bus for desktop integration hooks used by Chromium-based browsers.
    if command -v dbus-launch >/dev/null 2>&1; then
      eval "$(dbus-launch --sh-syntax)"
      export DBUS_SESSION_BUS_ADDRESS
      export DBUS_SESSION_BUS_PID
      export DBUS_SYSTEM_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}"
      echo "Started DBus session bus: ${DBUS_SESSION_BUS_ADDRESS}"
    fi
    
    if [ ! -f "${WESTON_CERT}" ] || [ ! -f "${WESTON_KEY}" ]; then
      openssl req -x509 -newkey rsa:2048 -nodes -sha256 \
        -keyout "${WESTON_KEY}" \
        -out "${WESTON_CERT}" \
        -days 3650 \
        -subj "/CN=browser-rdp" >/dev/null 2>&1
    fi
    
    cat > /tmp/browser-launch.sh <<EOF
    #!/bin/bash
    set -euo pipefail
    # Clean stale Chromium profile locks left by previous pod hostname/PID.
    rm -f /home/appuser/chrome-data/SingletonLock \
          /home/appuser/chrome-data/SingletonSocket \
          /home/appuser/chrome-data/SingletonCookie \
          /home/appuser/chrome-data/DevToolsActivePort || true
    exec $(printf '%q ' "$@")
    EOF
    chmod +x /tmp/browser-launch.sh
    
    cat > /tmp/weston.ini <<'EOF'
    [core]
    xwayland=true
    idle-time=0
    
    [autolaunch]
    path=/tmp/browser-launch.sh
    watch=true
    EOF
    
    weston \
      --backend=rdp-backend.so \
      --xwayland \
      --socket="${WAYLAND_DISPLAY}" \
      --config=/tmp/weston.ini \
      --width=1920 \
      --height=1080 \
      --rdp-tls-cert="${WESTON_CERT}" \
      --rdp-tls-key="${WESTON_KEY}" \
      --log=/tmp/weston.log &
    WESTON_PID=$!
    
    echo "Waiting for browser debugging interface..."
    for _ in $(seq 1 60); do
      if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
        echo "Browser debugging interface is ready"
        break
      fi
      sleep 1
    done
    
    cat > /tmp/nginx-cdp.conf <<'EOF'
    daemon off;
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /tmp/nginx-error.log;
    events { worker_connections 1024; }
    http {
        access_log /tmp/nginx-access.log;
        client_body_temp_path /tmp/nginx-client-body;
        proxy_temp_path /tmp/nginx-proxy;
        fastcgi_temp_path /tmp/nginx-fastcgi;
        uwsgi_temp_path /tmp/nginx-uwsgi;
        scgi_temp_path /tmp/nginx-scgi;
        server {
            listen 9223;
            location = /json/version {
                proxy_pass http://127.0.0.1:9222/json/version;
                proxy_http_version 1.1;
                proxy_set_header Host localhost:9222;
                proxy_set_header Accept-Encoding "";
                sub_filter_types application/json;
                sub_filter_once off;
                sub_filter "ws://localhost:9222/" "ws://browser:9223/";
            }
            location = /json {
                proxy_pass http://127.0.0.1:9222/json;
                proxy_http_version 1.1;
                proxy_set_header Host localhost:9222;
                proxy_set_header Accept-Encoding "";
                sub_filter_types application/json;
                sub_filter_once off;
                sub_filter "ws://localhost:9222/" "ws://browser:9223/";
            }
            location ^~ /json/ {
                proxy_pass http://127.0.0.1:9222;
                proxy_http_version 1.1;
                proxy_set_header Host localhost:9222;
                proxy_set_header Accept-Encoding "";
                sub_filter_types application/json;
                sub_filter_once off;
                sub_filter "ws://localhost:9222/" "ws://browser:9223/";
            }
            location / {
                proxy_pass http://127.0.0.1:9222;
                proxy_http_version 1.1;
                proxy_set_header Host localhost:9222;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400;
            }
        }
    }
    EOF
    
    nginx -c /tmp/nginx-cdp.conf &
    echo "nginx reverse proxy forwarding CDP port 9222 to 9223"
    
    wait "${WESTON_PID}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser
  namespace: openclaw
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: browser
  template:
    metadata:
      labels:
        app: browser
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data && chown -R 1000:1000 /data"]
          volumeMounts:
            - name: appuser
              mountPath: /data
      containers:
        - name: browser
          image: ghcr.io/bugparty/browserdocker-chrome:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "/opt/browser/browser-entrypoint.sh"]
          args:
            - chrome
            - --user-data-dir=/home/appuser/chrome-data
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --remote-allow-origins=*
            - --no-sandbox
            - --disable-setuid-sandbox
            - --disable-dev-shm-usage
            - --disable-dbus
            - --disable-background-timer-throttling
            - --disable-renderer-backgrounding
            - --disable-backgrounding-occluded-windows
            - --disable-features=TranslateUI,BlinkGenPropertyTrees,VizDisplayCompositor
            - --disable-background-networking
            - --disable-component-update
            - --disable-sync
            - --disable-default-apps
            - --disable-web-security
            - --no-zygote
            - --single-process
            - --ozone-platform-hint=auto
            - --use-angle=swiftshader
            - --use-gl=angle
            - --enable-webgl
            - --no-first-run
            - --no-default-browser-check
            - --disable-blink-features=AutomationControlled
            - --user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
          ports:
            - containerPort: 3389
              name: rdp
            - containerPort: 9223
              name: cdp
          readinessProbe:
            httpGet:
              path: /json/version
              port: 9223
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /json/version
              port: 9223
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: appuser
              mountPath: /home/appuser
            - name: browser-bootstrap
              mountPath: /opt/browser/browser-entrypoint.sh
              subPath: browser-entrypoint.sh
      volumes:
        - name: appuser
          persistentVolumeClaim:
            claimName: browser-appuser
        - name: browser-bootstrap
          configMap:
            name: browser-bootstrap
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: browser
  namespace: openclaw
spec:
  type: ClusterIP
  selector:
    app: browser
  ports:
    - name: cdp
      port: 9223
      targetPort: 9223
---
apiVersion: v1
kind: Service
metadata:
  name: browser-rdp
  namespace: openclaw
spec:
  type: NodePort
  selector:
    app: browser
  ports:
    - name: rdp
      port: 3389
      targetPort: 3389
      nodePort: 30389
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-home-perms
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /home-data /brew-data && chown -R 1000:1000 /home-data /brew-data"]
          volumeMounts:
            - name: openclaw-home
              mountPath: /home-data
            - name: openclaw-linuxbrew
              mountPath: /brew-data
      containers:
        - name: openclaw
          image: ghcr.io/bugparty/browserdocker-openclaw:latest
          imagePullPolicy: Always
          args: ["bash", "/opt/openclaw/run-openclaw.sh"]
          env:
            - name: HOME
              value: /home/node
            - name: NODE_COMPILE_CACHE
              value: /home/node/.cache/node-compile-cache
            - name: TERM
              value: xterm-256color
          envFrom:
            - secretRef:
                name: openclaw-env
          ports:
            - containerPort: 18789
              name: gateway
            - containerPort: 18790
              name: bridge
          startupProbe:
            tcpSocket:
              port: 18789
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node
            - name: openclaw-linuxbrew
              mountPath: /home/linuxbrew
            - name: bootstrap
              mountPath: /opt/openclaw/run-openclaw.sh
              subPath: run-openclaw.sh
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-home
        - name: openclaw-linuxbrew
          persistentVolumeClaim:
            claimName: openclaw-linuxbrew
        - name: bootstrap
          configMap:
            name: openclaw-bootstrap
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  type: ClusterIP
  selector:
    app: openclaw
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
    - name: bridge
      port: 18790
      targetPort: 18790
