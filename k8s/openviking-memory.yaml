apiVersion: v1
kind: Secret
metadata:
  name: openviking-config
  namespace: openclaw
type: Opaque
stringData:
  OPENVIKING_CONF_CONTENT: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "root_api_key": "change-me-openviking-root-key"
      },
      "embedding": {
        "dense": {
          "provider": "openai",
          "api_base": "http://llama-cpp.default.svc.cluster.local:8080/v1",
          "api_key": "llama-cpp-local-placeholder",
          "model": "model.gguf",
          "dimension": 1024,
          "encoding_format": "float"
        }
      },
      "memory": {
        "version": "v2"
      },
      "storage": {
        "workspace": "/app/.openviking/data",
        "agfs": {
          "backend": "local"
        },
        "vectordb": {
          "backend": "local",
          "name": "context"
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openviking-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openviking
  namespace: openclaw
spec:
  selector:
    matchLabels:
      app: openviking
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: openviking
    spec:
      containers:
        - name: openviking
          # openviking v0.4.21; pinned by digest so a node reboot cannot pull a new release
          image: ghcr.io/volcengine/openviking@sha256:569193efd49ad15a818c98ca66bfb566d1726713f1f3ec9c488b97fa66757d05
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENVIKING_WITH_BOT
              value: "0"
            - name: OPENVIKING_CONF_CONTENT
              valueFrom:
                secretKeyRef:
                  name: openviking-config
                  key: OPENVIKING_CONF_CONTENT
          ports:
            - name: http
              containerPort: 1933
          livenessProbe:
            httpGet:
              path: /health
              port: 1933
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 1933
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: openviking-data
              mountPath: /app/.openviking
      volumes:
        - name: openviking-data
          persistentVolumeClaim:
            claimName: openviking-data
---
apiVersion: v1
kind: Service
metadata:
  name: openviking
  namespace: openclaw
spec:
  type: ClusterIP
  selector:
    app: openviking
  ports:
    - name: http
      port: 1933
      targetPort: 1933
